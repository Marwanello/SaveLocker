<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decky and Playnite Mockups</title>
<style>
/* Mockup strip: the same as the agent and console mockups. Decky frame: Steam Gaming Mode as measured on the Deck
   (854×534 CSS px, values read from the live UI). Playnite frame: Harmony, the theme this PC runs, from its
   Constants.xaml and a window capture. */
:root {
  color-scheme: dark;
  --strip: #141416; --strip-line: #26262a; --strip-fg: #f0eee9; --strip-dim: #a09d97; --strip-faint: #817e78; --accent: #e0533c; --on-accent: #160f0e;
  --st-bg: #0e141b; --st-side: #2b2d33; --st-field: #23262e; --st-field-focus: #383a41; --st-fg: #dcdedf; --st-white: #ffffff; --st-dim: #b8bcbf;
  --st-btn: rgba(255,255,255,.15); --st-input: rgba(255,255,255,.1); --st-blue: #1a9fff; --st-dialog-line: #23262e;
  --pn-window: #0c0d0d; --pn-top: #1d1c1e; --pn-list: #030202; --pn-detail: #040404; --pn-fg: #f0f5ff; --pn-dim: #a3a3a3;
  --pn-glyph: #e3da4f; --pn-sel: #403d1f; --pn-popup: #33343d; --pn-popup-line: #262c38; --pn-btn: #363742; --pn-card: #1b1b1a;
  --pn-play-fg: #16171a; --pn-winbg: #1f2026;
  --steam: 'Motiva Sans', Arial, Helvetica, sans-serif;
  --trebuchet: 'Trebuchet MS', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #09090a; color: var(--strip-fg); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.strip { flex: none; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px max(16px, env(safe-area-inset-left, 0px)) 6px max(16px, env(safe-area-inset-right, 0px)); background: var(--strip); border-bottom: 1px solid var(--strip-line); font-size: 12px; color: var(--strip-dim); }
.strip h1 { margin: 0; font-size: 13px; font-weight: 700; color: var(--strip-fg); }
.strip h1 small { margin-left: 8px; font-weight: 400; color: var(--strip-faint); }
.grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--strip-faint); margin-right: 2px; }
.mbtn { font-size: 11.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid #303034; background: #1d1d20; color: var(--strip-fg); cursor: pointer; text-decoration: none; }
.mbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.sp { flex: 1; }
.notes { flex: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 24px; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px)); background: var(--strip); border-bottom: 1px solid var(--strip-line); color: var(--strip-dim); font-size: 12px; }
.notes p { margin: 0; } .notes b { color: var(--strip-fg); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16px; overflow: auto; }
.scaler { position: relative; flex: none; }
.scaler > * { position: absolute; top: 0; left: 0; transform-origin: top left; }

/* ---------------- Steam Gaming Mode (Decky) ---------------- */
.deck { position: relative; width: 854px; height: 534px; background: var(--st-bg); color: var(--st-fg); font: 16px var(--steam); overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.6); }
.st-top { position: absolute; inset: 0 0 auto; height: 40px; display: flex; align-items: center; justify-content: flex-end; gap: 20px; padding: 0 22px; font-size: 15px; color: #fff; background: rgba(14,20,27,.85); z-index: 3; }
.st-bottom { position: absolute; inset: auto 0 0; height: 42px; display: flex; align-items: center; gap: 22px; padding: 0 24px; font-size: 12.5px; letter-spacing: .04em; color: #fff; background: #0b0f14; z-index: 3; }
.st-bottom .r { margin-left: auto; display: flex; gap: 22px; }
.st-pill { background: #fff; color: #0e141b; font-weight: 700; border-radius: 99px; padding: 3px 10px; margin-right: 6px; font-size: 11.5px; }
.st-key { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #0e141b; font-weight: 700; font-size: 12px; margin-right: 6px; }
.st-page { position: absolute; top: 40px; bottom: 42px; left: 0; right: 0; display: grid; grid-template-columns: 240px 1fr; }
.st-side { background: var(--st-side); padding-bottom: 42px; }
.st-side h2 { margin: 0; padding: 8px 16px 0 24px; font-size: 22px; line-height: 28px; font-weight: 700; color: #fff; height: 36px; }
.st-nav { padding: 16px 0; display: flex; flex-direction: column; }
.st-nav button { display: flex; align-items: center; gap: 18px; padding: 10px 24px; line-height: 22px; font-size: 16px; color: var(--st-dim); background: none; border: 0; text-align: left; cursor: pointer; }
.st-nav button[aria-current="page"] { color: #fff; background-image: linear-gradient(90deg, rgba(26,159,255,.22) 0%, rgba(26,159,255,0) 100%); box-shadow: inset 3px 0 0 var(--st-blue); }
.st-nav hr { border: 0; border-top: 1px solid rgba(255,255,255,.12); margin: 6px 24px; }
.st-nav svg { width: 18px; height: 18px; flex: none; }
.st-content { padding: 24px 24px 0; overflow: auto; scrollbar-width: none; }
.st-title { font-size: 22px; font-weight: 700; color: #fff; margin: 0 0 14px; }
.st-sec { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: rgba(255,255,255,.7); margin: 0 0 12px; }
.st-label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: rgba(255,255,255,.7); margin: 0 0 6px; }
.st-input { height: 40px; border-radius: 10px; background: var(--st-input); padding: 10px 16px; color: #fff; margin-bottom: 16px; }
.st-count { font-size: 12px; padding: 6px 0 10px; }
.field { display: flex; align-items: center; gap: 12px; background: var(--st-field); border-radius: 2px; padding: 12px; margin-top: 6px; min-height: 64px; cursor: pointer; border: 0; width: 100%; text-align: left; color: var(--st-fg); }
.field:hover, .field.focus { background: var(--st-field-focus); color: #fff; }
.field .t { flex: 1; min-width: 0; }
.field .l { display: block; font-size: 16px; line-height: 20px; }
.field .d { display: block; font-size: 12px; line-height: 16px; margin-top: 4px; color: var(--st-dim); overflow-wrap: anywhere; }
.dbtn { background: var(--st-btn); color: var(--st-fg); border: 0; border-radius: 10px; padding: 8px 14px; font-size: 16px; line-height: 20px; cursor: pointer; white-space: nowrap; font-family: var(--steam); }
.dbtn:hover, .dbtn.focus { background: #fff; color: #0e141b; }
.dbtn.primary { background: var(--st-blue); color: #fff; }
.dbtn.small { font-size: 14px; padding: 6px 12px; }
.chev { font-size: 12px; margin-left: 6px; }
.toggle { width: 44px; height: 24px; border-radius: 99px; background: var(--st-blue); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.st-scrim { position: absolute; inset: 40px 0 42px; background: rgba(0,0,0,.6); z-index: 2; display: grid; place-items: start center; }
.st-dialog { margin-top: 24px; width: 660px; max-height: calc(100% - 48px); overflow: auto; scrollbar-width: none; background: var(--st-bg); border: 2px solid var(--st-dialog-line); border-radius: 10px; padding: 24px; }
.st-dialog.narrow { width: 480px; }
.st-dialog h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: var(--st-fg); }
.st-dialog .sub { font-size: 13px; margin: 0 0 16px; opacity: .9; }
.st-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.st-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.st-steps li { display: flex; gap: 10px; align-items: flex-start; color: rgba(255,255,255,.45); }
.st-steps li.done, .st-steps li.run { color: #fff; }
.st-steps li.fail { color: #ff8f7a; }
.st-steps small { display: block; font-size: 12px; color: var(--st-dim); }
.st-mark { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); flex: none; margin-top: 1px; display: grid; place-items: center; font-size: 11px; }
.st-steps li.done .st-mark { background: #59bf40; border-color: #59bf40; color: #0e141b; }
.st-steps li.fail .st-mark { background: #d94126; border-color: #d94126; color: #fff; }
.st-steps li.run .st-mark { border-color: var(--st-blue); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .st-steps li.run .st-mark { animation: none; } }
.dropdown { position: absolute; z-index: 4; background: #3d4450; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.6); padding: 4px 0; min-width: 240px; }
.dropdown button { display: flex; gap: 8px; align-items: baseline; width: 100%; background: none; border: 0; padding: 8px 14px; font-size: 15px; color: #fff; text-align: left; cursor: pointer; font-family: var(--steam); }
.dropdown button:hover { background: rgba(255,255,255,.12); }
.dropdown small { color: var(--st-dim); font-size: 12px; margin-left: auto; }
.st-tools { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
.st-tools .st-input { flex: 1; margin: 0; }
.st-seg { display: flex; gap: 4px; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px; }
.st-seg button { background: none; border: 0; border-radius: 8px; padding: 6px 12px; font: 14px var(--steam); color: var(--st-dim); cursor: pointer; }
.st-seg button[aria-pressed="true"] { background: var(--st-btn); color: #fff; }
.gicon { width: 40px; height: 40px; border-radius: 4px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: rgba(255,255,255,.9); }
.st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px; padding: 8px 0 24px; }
.tile { position: relative; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--st-fg); font-family: var(--steam); }
.tile .poster { aspect-ratio: 2 / 3; border-radius: 4px; display: grid; place-items: center; font-size: 40px; font-weight: 700; color: rgba(255,255,255,.88); box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.tile.focus .poster, .tile:hover .poster { outline: 3px solid #fff; outline-offset: 2px; }
.tile .n { display: block; font-size: 13px; line-height: 16px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .dbtn { position: absolute; left: 6px; right: 6px; bottom: 30px; text-align: center; font-size: 12px; padding: 4px 6px; background: rgba(14,20,27,.85); }
/* QAM */
.qam { position: absolute; top: 40px; bottom: 42px; right: 0; width: 360px; display: grid; grid-template-columns: 48px 1fr; background: #0e141b; z-index: 2; box-shadow: -10px 0 30px rgba(0,0,0,.5); }
.qam-tabs { background: #0b0f14; display: flex; flex-direction: column; align-items: center; gap: 34px; padding-top: 18px; color: #8b929a; }
.qam-tabs .on { color: #fff; background: #23262e; width: 48px; display: grid; place-items: center; padding: 10px 0; }
.qam-body { padding: 14px 16px; overflow: auto; }
.qam-head { display: flex; align-items: center; gap: 26px; margin-bottom: 12px; }
.qam-back { width: 40px; height: 28px; border-radius: 6px; background: #3d4450; display: grid; place-items: center; color: #fff; }
.qam-head h4 { margin: 0; font-size: 20px; color: #fff; }
.qam-status { background: #23262e; border-radius: 2px; padding: 10px 14px; margin: 0 -16px 16px; box-shadow: 0 0 0 10px #2b2d33; }
.qam-status b { display: flex; align-items: center; gap: 8px; color: #fff; }
.qam-status b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #59bf40; }
.qam-status span { font-size: 12px; color: var(--st-dim); }
.qam-sec { font-size: 15px; font-weight: 700; letter-spacing: .5px; color: #b8bcbf; margin: 14px 0 10px; }
.qam-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.qam-wide { width: 100%; margin: 10px 0; }

/* ---------------- Playnite (Harmony) ---------------- */
.pn { position: relative; width: 1100px; height: 640px; background: var(--pn-window); color: var(--pn-fg); font: 14px var(--trebuchet); overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.6); }
.pn-top { height: 44px; background: var(--pn-top); display: flex; align-items: center; gap: 18px; padding: 0 14px; color: var(--pn-glyph); }
.pn-search { width: 210px; height: 28px; border: 1px solid var(--pn-glyph); border-radius: 8px; background: #0e0e0f; }
.pn-top .pn-glyphs { display: flex; gap: 18px; font-size: 16px; }
.pn-top .pn-win { margin-left: auto; display: flex; gap: 18px; color: var(--pn-dim); }
.pn-main { position: absolute; top: 44px; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: 44px 270px 1fr; gap: 10px; padding: 0 10px 10px 0; }
.pn-rail { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 14px; color: var(--pn-glyph); }
.pn-list { background: var(--pn-list); border-radius: 5px; padding: 4px; overflow: hidden; }
.pn-group { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 14px; }
.pn-group i { background: #268243; color: #fff; font-style: normal; font-size: 11px; border-radius: 7px; padding: 0 7px; }
.pn-game { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 5px; cursor: default; }
.pn-game .ic { width: 22px; height: 22px; border-radius: 4px; background: linear-gradient(135deg, #3b3a2b, #1a1a14); flex: none; }
.pn-game.sel { background: var(--pn-sel); outline: 1px solid rgba(227,218,79,.35); }
.pn-detail { background: var(--pn-detail); border-radius: 5px; padding: 24px 28px; position: relative; overflow: hidden; }
.pn-cover { width: 108px; height: 160px; border-radius: 5px; background: linear-gradient(160deg, #3d3a24, #121209); margin-bottom: 14px; display: grid; place-items: center; font-size: 46px; font-weight: 700; color: rgba(255,255,255,.85); }
.pn-name { font-size: 29px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
.pn-actions { display: flex; gap: 10px; align-items: center; }
.pn-play { background: var(--pn-glyph); color: var(--pn-play-fg); border: 0; border-radius: 14px; padding: 9px 40px; font: 15px var(--trebuchet); font-weight: 700; }
.pn-more { background: var(--pn-btn); color: var(--pn-fg); border: 0; border-radius: 14px; padding: 9px 40px; font: 15px var(--trebuchet); font-weight: 700; cursor: pointer; }
.pn-sq { width: 38px; height: 38px; border-radius: 8px; background: #2c2931; display: grid; place-items: center; color: var(--pn-glyph); }
.pn-card { background: var(--pn-card); border-radius: 8px; padding: 12px 16px; margin-top: 18px; max-width: 520px; font-size: 13px; }
.pn-card b { color: var(--pn-glyph); font-weight: 400; border-bottom: 2px solid var(--pn-glyph); padding-bottom: 4px; display: inline-block; margin-bottom: 10px; }
.pn-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.pn-tag { background: #262d27; border-radius: 8px; padding: 2px 10px; font-size: 12.5px; }
.cmenu { position: absolute; z-index: 5; background: var(--pn-popup); border: 1px solid var(--pn-popup-line); border-radius: 5px; padding: 10px 0; min-width: 230px; box-shadow: 0 8px 24px rgba(0,0,0,.55); font: 14px var(--trebuchet); }
.cmi { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; width: 100%; background: none; border: 0; color: var(--pn-fg); text-align: left; padding: 5px 10px 5px 4px; cursor: pointer; font: 14px var(--trebuchet); position: relative; }
.cmi:hover, .cmi.hl { background: rgba(227,218,79,.5); }
.cmi .gl { text-align: center; color: var(--pn-glyph); }
.cmi:hover .gl, .cmi.hl .gl { color: var(--pn-fg); }
.cmi .arr { font-size: 11px; opacity: .8; }
.cmi .sc { opacity: .6; font-size: 12.5px; margin-left: 20px; }
.csep { height: 1px; background: var(--pn-glyph); opacity: .5; margin: 2px 0; }
.pwin-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 6; display: grid; place-items: center; }
.pwin { width: 480px; background: var(--pn-winbg); border: 1px solid var(--pn-popup-line); box-shadow: 0 20px 50px rgba(0,0,0,.6); font: 14px var(--trebuchet); }
.pwin-title { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #17181d; font-size: 13px; color: var(--pn-dim); }
.pwin-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.pwin-body .h { font-weight: 600; }
.pwin-body .small { font-size: 12px; opacity: .8; }
.pwin-list { display: flex; flex-direction: column; border: 1px solid var(--pn-popup-line); border-radius: 5px; overflow: hidden; margin: 6px 0; }
.pwin-list button { display: flex; justify-content: space-between; gap: 10px; background: none; border: 0; color: var(--pn-fg); padding: 8px 10px; text-align: left; cursor: pointer; font: 14px var(--trebuchet); }
.pwin-list button:hover { background: rgba(227,218,79,.2); }
.pwin-list button[aria-pressed="true"] { background: rgba(227,218,79,.5); }
.pwin-list small { opacity: .7; }
.pwin-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 16px; }
.pbtn { background: var(--pn-btn); color: var(--pn-fg); border: 0; border-radius: 8px; padding: 5px 12px; cursor: pointer; font: 14px var(--trebuchet); }
.pbtn:hover { background: #45465a; }
.pbtn.go { background: var(--pn-glyph); color: var(--pn-play-fg); }
.pbtn:disabled { opacity: .45; cursor: default; }
.pinput { background: #0e0e0f; border: 1px solid var(--pn-popup-line); border-radius: 5px; color: var(--pn-fg); font: 14px var(--trebuchet); padding: 6px 8px; }
.pinput:focus { outline: 1px solid var(--pn-glyph); }
.pradio { display: flex; gap: 8px; align-items: flex-start; padding: 6px 2px; cursor: pointer; }
.pradio input, .pcheck input { accent-color: var(--pn-glyph); margin-top: 3px; }
.pcheck { display: flex; gap: 8px; align-items: center; padding: 3px 2px 3px 24px; font-size: 13px; cursor: pointer; }
.pwin .st-steps li { color: rgba(240,245,255,.45); }
.pwin .st-steps li.done, .pwin .st-steps li.run { color: var(--pn-fg); }
.pwin .st-steps li.run .st-mark { border-color: var(--pn-glyph); border-top-color: transparent; }
.pwin .st-steps li.done .st-mark { background: var(--pn-glyph); border-color: var(--pn-glyph); }
</style>
<div class="strip">
  <h1>Decky &amp; Playnite<small>rebuilt from the Deck’s live UI and this PC’s Playnite theme</small></h1>
  <div class="grp"><span class="lbl">Where</span><span id="where"></span></div>
  <span class="sp"></span>

</div>
<div class="strip">
  <div class="grp"><span class="lbl">Variant</span><span id="variants"></span></div>

<script>
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const FEATURES = {
    decky: {
      name: 'Decky (Steam Deck)', pick: 'Chosen: B · On the Games row (2026-10-23): fast and responsive. The same dropdown is in the QAM, under the selected game and in its Sync options. Also planned: game icons on the Games list, and List / Grid with posters like the agent.',
      always: 'Matches the live plugin: Steam’s sidebar page, Field rows and dialogs, measured on the Deck. Games has game icons and a List / Grid toggle (posters, like the agent). The QAM names the selected game’s playthrough and can switch it. Switching is refused while the game runs; no notification at launch.',
      variants: {
        A: ['In the game’s dialog', 'Games → a game opens its dialog, as today. A new “Playthrough” Field shows the one this Deck plays, with “Switch…”. Hidden when the game has only one playthrough.', 'Open “Baldur’s Gate 3” → Switch… → Main → Switch. Then open the QAM’s Advanced.'],
        B: ['On the Games row', 'Games with more than one playthrough get a small dropdown button on their row (or under their poster in Grid), showing the playthrough; picking one switches after a confirm. The QAM has the same dropdown for the selected game, and so does its Sync options dialog.', 'Press “Honour mode” on Baldur’s Gate 3 and pick Main. Switch to Grid. Then open Quick Access and use its Playthrough dropdown.'],
        C: ['A Playthroughs page', 'A new page in the sidebar lists every game that has playthroughs; a game opens its playthroughs as Fields, with A to play one here.', 'Open Playthroughs → Baldur’s Gate 3 → Main.'],
      },
    },
    playnite: {
      name: 'Playnite', pick: 'Chosen: A · Ticked submenu (2026-10-23): fewest clicks.',

          <label class="pradio" data-act="pnfrom" data-k="fresh"><input type="radio" name="pnfrom" ${n.from === 'fresh' ? 'checked' : ''}><span><span class="h">Start fresh</span><br><span class="small">An empty save folder, so the game starts a new game. Keep:</span></span></label>
          ${n.from === 'fresh' ? files.map(([f, why]) => `<label class="pcheck" data-act="pnkeep" data-k="${f}"><input type="checkbox" ${n.keep.includes(f) ? 'checked' : ''}><span>${esc(f)}</span><span class="small" style="margin-left:auto">${why}</span></label>`).join('') : ''}
          <label class="pcheck" style="padding-left:2px;margin-top:6px" data-act="pnnow"><input type="checkbox" ${n.now ? 'checked' : ''}><span>Play it on this PC now (uploads ${esc(pt(st.sel).name)} first)</span></label></div>
        <div class="pwin-foot"><button class="pbtn" data-act="pnclose">Cancel</button><button class="pbtn go" data-act="pncreate" ${n.name.trim() ? '' : 'disabled'}>Create</button></div></div></div>`
    }
    if (!st.flow) return ''
    const s = st.flow.state, t = pt(st.target)
    return `<div class="pwin-scrim"><div class="pwin"><div class="pwin-title"><span>SaveLocker — switch playthrough</span><span>✕</span></div>
      <div class="pwin-body"><div class="h">${s === 'fail' ? 'Couldn’t switch' : s === 'ok' ? 'Switched to "' + esc(t.name) + '"' : 'Switching to "' + esc(t.name) + '"…'}</div>${stepsHtml()}</div>
      ${s !== 'run' ? '<div class="pwin-foot"><button class="pbtn" data-act="pnclose">Close</button></div>' : ''}</div></div>`
  }
  function playnite() {
    const games = [['Legendary (Epic)', ['Calico', 'Fez', 'HITMAN 3']], ['Steam', ['Baldur’s Gate 3', 'Cyberpunk 2077', 'Slay the Spire']]]
    const tags = ['SaveLocker: Linked'].concat(st.v === 'C' ? ['SaveLocker: ' + pt(st.sel).name] : [])
    return `<div class="pn"><div class="pn-top"><span style="font-size:18px">◆</span><span class="pn-search"></span><span class="pn-glyphs">⌕ ▤ ☰ ▦ ⇄ ◷</span><span style="color:var(--pn-glyph)">▼ Filter Active</span><span class="pn-win">— ▢ ✕</span></div>
      <div class="pn-main"><div class="pn-rail">▥<br>◔<br>▮<br>♛</div>
      <div class="pn-list">${games.map(([g, list]) => `<div class="pn-group"><span>⌄ ${esc(g)}</span><i>${list.length}</i></div>` + list.map(n => `<div class="pn-game${n === 'Baldur’s Gate 3' ? ' sel' : ''}" ${n === 'Baldur’s Gate 3' ? 'data-act="ctx" title="Right-click"' : ''}><span class="ic"></span>${esc(n)}</div>`).join('')).join('')}</div>
      <div class="pn-detail" data-act="ctx"><div class="pn-cover">B</div><div class="pn-name">Baldur’s Gate 3</div>
        <div class="pn-actions"><button class="pn-play">▶ &nbsp;Play</button><button class="pn-more" data-act="ctx">More</button><span class="pn-sq">✎</span></div>
        <div class="pn-card"><b>Details</b><div style="display:grid;grid-template-columns:140px 1fr;gap:8px 12px"><span style="color:var(--pn-dim)">Recent Activity</span><span>Yesterday</span><span style="color:var(--pn-dim)">Tags</span><span class="pn-tags">${tags.map(t => `<span class="pn-tag">${esc(t)}</span>`).join('')}</span></div></div>
        <div style="position:absolute;bottom:14px;left:28px;font-size:12px;color:var(--pn-dim)">Right-click the game (or press More) for its menu.</div></div></div>
      ${pnMenus()}${pnWindow()}</div>`
  }

  /* ---------------- shell ---------------- */
  function fit() {
    const sc = document.getElementById('scaler'), stage = document.getElementById('stage')
    const w = st.where === 'decky' ? 854 : 1100, h = st.where === 'decky' ? 534 : 640
    const s = Math.min((stage.clientWidth - 32) / w, (stage.clientHeight - 32) / h, st.where === 'decky' ? 1.6 : 1.15)
    const k = Math.max(0.3, s)
    sc.style.width = w * k + 'px'; sc.style.height = h * k + 'px'
    if (sc.firstElementChild) sc.firstElementChild.style.transform = `scale(${k})`
  }
  function render() {
    const F = FEATURES[st.where], V = F.variants[st.v]
    document.getElementById('where').innerHTML = Object.entries(FEATURES).map(([k, f]) => `<button class="mbtn" data-act="where" data-k="${k}" aria-pressed="${st.where === k}">${f.name}</button>`).join(' ')
    document.getElementById('variants').innerHTML = Object.entries(F.variants).map(([k, v]) => `<button class="mbtn" data-act="var" data-k="${k}" aria-pressed="${st.v === k}">${k} · ${v[0]}</button>`).join(' ')
    document.getElementById('sims').innerHTML = [['online', 'Online'], ['offline', 'Server unreachable'], ['running', 'Game running']].map(([k, l]) => `<button class="mbtn" data-act="sim" data-k="${k}" aria-pressed="${st.sim === k}">${l}</button>`).join(' ')
    const n = document.getElementById('notes'); n.hidden = !st.notes
    n.innerHTML = `<p><b>${st.v} · ${esc(V[0])}.</b> ${esc(V[1])}</p><p><span class="lbl">Try it</span> ${esc(V[2])}</p><p><span class="lbl">In every variant</span> ${esc(F.always)}</p><p><span class="lbl">My pick</span> ${esc(F.pick)}</p>`
    document.getElementById('notesBtn').setAttribute('aria-pressed', st.notes)
    document.getElementById('scaler').innerHTML = st.where === 'decky' ? deck() : playnite()
    fit()
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) { if (st.menu) { st.menu = null; st.sub = null; render() } return }
    const a = t.dataset.act, k = t.dataset.k
    if (a === 'where') { st.where = k; st.v = 'A'; try { localStorage.setItem('slh:where', k) } catch (er) {} reset() }
    else if (a === 'var') { st.v = k; reset() }
    else if (a === 'sim') { st.sim = k }
    else if (a === 'page') { st.page = k; st.ptGame = false }
    else if (a === 'open') { st.dlg = 'game' }
    else if (a === 'dd') { e.stopPropagation(); st.dlg = st.dlg === 'dd' ? null : 'dd' }
    else if (a === 'pick') st.dlg = 'pick'
    else if (a === 'ask') { st.back = st.sub && st.sub.startsWith('q') ? st.dlg : null; st.sub = null; st.target = k; st.dlg = 'confirm' }
    else if (a === 'back') { st.dlg = st.back || (st.v === 'A' ? 'pick' : null); st.back = null }
    else if (a === 'go') { startSwitch(st.target); return }
    else if (a === 'done') { st.flow = null; st.dlg = st.back || (st.v === 'A' ? 'game' : null); st.back = null }
    else if (a === 'close') st.dlg = null
    else if (a === 'ptgame') st.ptGame = true
    else if (a === 'qam') st.dlg = st.dlg === 'qam' || st.dlg === 'advanced' ? null : 'qam'
    else if (a === 'advanced') st.dlg = 'advanced'
    else if (a === 'ctx') { st.menu = 'pn'; st.sub = null }
    else if (a === 'sub') { e.stopPropagation(); st.menu = 'pn'; st.sub = k === 'pt' ? 'pt' : (st.sub ? (k === 'sl' ? 'sl' : st.sub) : 'sl') }
    else if (a === 'pnpick') { st.menu = null; st.sub = null; if (k !== st.sel) { st.target = k; startSwitch(k); return } }
    else if (a === 'win') { st.menu = null; st.sub = null; st.dlg = 'pnwin'; st.target = st.sel }
    else if (a === 'pnsel') st.target = k
    else if (a === 'pngo') { st.dlg = null; if (st.target !== st.sel) { startSwitch(st.target); return } }
    else if (a === 'pnclose') { st.dlg = null; st.flow = null }
    else if (a === 'view') st.view = k
    else if (a === 'qdd') { e.stopPropagation(); st.sub = st.sub === k ? null : k; render(); return }
    else if (a === 'pnnew') { st.menu = null; st.sub = null; st.dlg = 'pnnew'; st.np = { name: '', from: 'current', keep: ['profile8.lsf'], now: true } }
    else if (a === 'pnfrom') { st.np.from = k }
    else if (a === 'pnkeep') { e.preventDefault(); st.np.keep = st.np.keep.includes(k) ? st.np.keep.filter(x => x !== k) : st.np.keep.concat(k) }
    else if (a === 'pnnow') { e.preventDefault(); st.np.now = !st.np.now }
    else if (a === 'pncreate') {
      const n = st.np, id = 'new' + PTS.length
      PTS = PTS.concat({ id, name: n.name.trim(), when: 'just now', by: 'this PC', fresh: n.from === 'fresh', keep: n.from === 'fresh' ? n.keep : [] })
      st.dlg = null
      if (n.now) { st.target = id; startSwitch(id); return }
    }
    else if (a === 'noop') return
    if (a !== 'ctx' && a !== 'sub') { if (!['pnpick', 'win'].includes(a)) { st.menu = st.menu && (a === 'where' || a === 'var') ? null : st.menu } }
    render()
  })
  document.addEventListener('contextmenu', e => { if (st.where === 'playnite' && e.target.closest('.pn')) { e.preventDefault(); st.menu = 'pn'; st.sub = null; render() } })
  document.addEventListener('input', e => {
    if (e.target.id !== 'pnname') return
    st.np.name = e.target.value
    const go = document.querySelector('[data-act="pncreate"]'); if (go) go.disabled = !st.np.name.trim()
  })
  document.getElementById('notesBtn').onclick = () => { st.notes = !st.notes; render() }
  document.getElementById('reset').onclick = () => { reset(); render() }
  window.addEventListener('resize', fit)
  reset(); render()
})()
</script>
