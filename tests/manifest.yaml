LGS Test Game:
  files:
    <winAppData>/LGSTestGame:
      tags:
        - save
    <winDocuments>/My Games/LGSTestGame/*.sav:
      tags:
        - save

# <winPublic> is the public profile ROOT (C:\Users\Public), so real manifest entries append
# Documents themselves — exactly as this one does. Resolving it as CommonDocuments instead doubled
# the segment and produced a path that never exists. See PathResolver.Windows().
LGS Public Game:
  files:
    <winPublic>/Documents/LGSPublicTestGame:
      tags:
        - save

# A hostile-shaped entry: the path climbs out of <winAppData> with ".." to C:\Users — a folder that
# EXISTS on every Windows box but sits under no token root. The old raw-string prefix check passed
# it (the raw path still began with <winAppData>'s value) and the collapsed answer was handed back;
# canonicalise-then-contain must refuse it. The sibling entry below proves the guard blocks
# nothing real.
LGS Traversal Game:
  files:
    <winAppData>/../../..:
      tags:
        - save

LGS Clean Sibling Game:
  files:
    <winAppData>/LGSCleanSibling:
      tags:
        - save
