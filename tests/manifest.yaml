LGS Test Game:
  files:
    <winAppData>/LGSTestGame:
      tags:
        - save
    <winDocuments>/My Games/LGSTestGame/*.sav:
      tags:
        - save

# <winPublic> is the public profile ROOT (C:\Users\Public), so real manifest entries append
# Documents themselves — exactly as this one does. Resolving it as CommonDocuments instead doubled
# the segment and produced a path that never exists. See PathResolver.Windows().
LGS Public Game:
  files:
    <winPublic>/Documents/LGSPublicTestGame:
      tags:
        - save

# A hostile-shaped entry: the path climbs out of <winAppData> with "..", landing in the user
# profile — a folder the suite can create without elevation, so the check distinguishes a REFUSAL
# from "nothing happens to be there". The destination is created by the suite before the check.
# The sibling entry below proves the guard blocks nothing real.
LGS Traversal Game:
  files:
    <winAppData>/../../LGSTraversalEscape:
      tags:
        - save

LGS Clean Sibling Game:
  files:
    <winAppData>/LGSCleanSibling:
      tags:
        - save
