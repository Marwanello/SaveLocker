# Fixture manifest for the Linux harness. Mirrors the shape of the real Ludusavi manifest:
# a Windows game whose save path is a <winAppData> token — which, under Proton, must resolve
# INSIDE the game's Wine prefix rather than against the host.
#
# The portable game is here ONLY to pin the install-root guard. Its manifest entry saves as a loose
# file beside the executable — the Cave Story+ shape — so it resolves to the install DIRECTORY, i.e.
# the whole game. That answer must be dropped, leaving the real portable save folder (<base>/Saves)
# to win. Without the guard the install directory resolves first and beats it.
Fake Prefix Game:
  files:
    <winAppData>/FakePrefixGame:
      tags:
        - save
Fake Portable Game:
  files:
    <base>/Save.dat:
      tags:
        - save

# The two Heroic games. Same tokens, resolved inside prefixes Steam did not create: one
# proton-shaped (pfx/, user steamuser), one wine-shaped (drive_c/ directly, Linux username).
Heroic Prefix Game:
  files:
    <winAppData>/HeroicPrefixGame:
      tags:
        - save
Heroic Wine Game:
  files:
    <winDocuments>/HeroicWineGame:
      tags:
        - save

# Present in the manifest ON PURPOSE. The renamed-prefix case is only a real test if the stranded
# save WOULD resolve: a resolver that fell back to the prefix holding the game's files would find
# this and hand back a path nothing writes to any more.
Heroic Offline Game:
  files:
    <winDocuments>/HeroicOfflineGame:
      tags:
        - save
