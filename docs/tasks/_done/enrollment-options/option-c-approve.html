/* ============================================================================

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0f10;--panel:#141416;--raise:#191a1c;--tile:#1b1c1f;--hover:#202124;

  --accent-soft:color-mix(in oklab,var(--accent) 14%,var(--panel));
  --accent-line:color-mix(in oklab,var(--accent) 42%,var(--panel));
  --accent-ink:color-mix(in oklab,var(--accent) 80%,var(--fg));
  --safe-soft:color-mix(in oklab,var(--safe) 14%,var(--panel));
  --safe-line:color-mix(in oklab,var(--safe) 40%,var(--panel));
  --safe-ink:color-mix(in oklab,var(--safe) 82%,var(--fg));
  --watch-soft:color-mix(in oklab,var(--watch) 14%,var(--panel));
  --watch-line:color-mix(in oklab,var(--watch) 40%,var(--panel));
  --watch-ink:color-mix(in oklab,var(--watch) 82%,var(--fg));
  --font-sans:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.2,.8,.25,1);color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#f5f3ef;--panel:#fffefc;--raise:#f0ede8;--tile:#ebe7e0;--hover:#e8e3dc;
  --fg:#191719;--dim:#57534d;--faint:#79756f;--line:#e2ddd5;--row:#eeeae3;
  --safe:#4c7b3e;--watch:#8a6212;--info:#3d6aa8;--accent:#c0432c;--on-accent:#fff8f6;color-scheme:light;
}
@media (prefers-color-scheme: light){

    --ink:#f5f3ef;--panel:#fffefc;--raise:#f0ede8;--tile:#ebe7e0;--hover:#e8e3dc;
    --fg:#191719;--dim:#57534d;--faint:#79756f;--line:#e2ddd5;--row:#eeeae3;
    --safe:#4c7b3e;--watch:#8a6212;--info:#3d6aa8;--accent:#c0432c;--on-accent:#fff8f6;color-scheme:light;

body{background:var(--ink);color:var(--fg);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

.bellacts{grid-column:2;display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.page-canvas{display:flex;flex-direction:column;gap:14px;padding:20px 22px 30px}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

.strip{border:1px dashed var(--line);border-radius:12px;padding:9px 14px;font-size:11.5px;color:var(--faint);text-align:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}

.card .pad{padding:15px 16px}
.dt{width:100%;border-collapse:collapse}

.osbadge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;vertical-align:-3px;margin-right:7px}

.reqrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.reqicon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--raise);border:1px solid var(--line);color:var(--info);flex-shrink:0}
.reqmain{flex:1;min-width:240px}
.reqmain .rt{font-size:14px;font-weight:600}
.reqmain .rs{font-size:12px;color:var(--dim);margin-top:3px}
.reqmain .rcode{font-family:var(--mono);font-weight:600;color:var(--fg);letter-spacing:.08em}
.reqactions{display:flex;gap:8px;flex-wrap:wrap}
.notebox{margin-top:13px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--raise);font-size:12px;color:var(--dim);line-height:1.5}

/* --- agent UI chrome ---------------------------------------------------------- */
.agent{display:flex;flex-direction:column;height:580px;background:var(--ink)}
.agentbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}

.spacer{flex:1}
.agentbody{flex:1;display:flex;min-height:0}

.acontent{flex:1;overflow:auto;padding:18px 20px}

.sl-stack{display:flex;flex-direction:column;gap:14px}

.pick{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--raise);cursor:pointer;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.pick:hover{border-color:var(--faint)}
.pick.cur{border-color:var(--accent-line);background:var(--accent-soft)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);flex-shrink:0;display:grid;place-items:center}

#toaster{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:92vw}

<div class="mockbar">

  <span class="seg sm" role="group" aria-label="Theme">

<script>
/* ============================================================================
   State
   ========================================================================== */
const S = {
  step: 0, theme: 'system',
  picked: 'disc',          // disc | manual
  asked: false, approved: false, denied: false,
  code: 'WOLF-4821', waitLeft: 272,
  bellOpen: true,
};
const STEPS = [
  {
    id: 1, device: 'agent', title: 'The device asks to join',
    sub: 'Agent first run → Connect to SaveLocker',
    notes: [
      'On first run the agent opens a pairing request on the server: name, OS, address, and a 4-letter confirmation code. <b>No secret is generated yet.</b>',
      'Discovery: the server advertises <span class="mono">_savelocker._tcp</span> over mDNS/DNS-SD, so the address is found on the LAN. Typing it once is the fallback \u2014 a Docker container needs host networking for mDNS to escape.',
      'The request is throttled, holds no key, and expires after 5 minutes.',
    ],
  },
  {
    id: 2, device: 'console', title: 'Approve it on the console',
    sub: 'bell notice + Join requests card',
    notes: [
      'Admin routes <span class="mono">GET/POST /api/admin/join-requests</span>, plus the bell notice. Approving requires the admin password \u2014 the same rule registration already defaults to.',
      'Approve mints the machine key and hands it to the waiting agent over its own poll. <b>The key never appears on a screen.</b>',
      'The code on the device\u2019s screen is the check: approve only when <span class="mono">WOLF-4821</span> matches. That keeps a stranger on the LAN from slipping in a silent join.',
    ],
  },
  {
    id: 3, device: 'agent', title: 'Registered and syncing',
    sub: 'no code was ever typed on this device',
    notes: [
      'Zero credentials moved between machines: the console\u2019s decision <i>was</i> the credential.',
      'Deny is recorded and the request disappears; an unapproved request simply expires.',
      'Re-pairing a wiped machine is the same motion \u2014 ask, approve, done.',
    ],
  },
];
const BUILD_NOTES = [
  '<b>Server</b> \u2014 request create/poll routes (throttled), admin list/approve/deny, the bell notice, and an mDNS advertisement for discovery.',
  '<b>Agent</b> \u2014 a first-run ask screen and a poll for the decision; nothing else changes.',
  '<b>Trade-off</b> \u2014 nothing to copy or type (the Plex / Steam Link motion), and the least left to get wrong. Needs the console nearby (LAN, VPN, or a browser on any device) to approve.',
];

/* ------------------------------------------------------------------------ */
const ICONS = {
  check:[['path',{d:'M20 6 9 17l-5-5'}]],
  'chevron-left':[['path',{d:'m15 18-6-6 6-6'}]],
  'chevron-right':[['path',{d:'m9 18 6-6-6-6'}]],
  'refresh-cw':[['path',{d:'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8'}],['path',{d:'M21 3v5h-5'}],['path',{d:'M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16'}],['path',{d:'M8 16H3v5'}]],
  plus:[['path',{d:'M5 12h14'}],['path',{d:'M12 5v14'}]],

  'gamepad-2':[['line',{x1:'6',x2:'10',y1:'11',y2:'11'}],['line',{x1:'8',x2:'8',y1:'9',y2:'13'}],['line',{x1:'15',x2:'15.01',y1:'12',y2:'12'}],['line',{x1:'18',x2:'18.01',y1:'10',y2:'10'}],['path',{d:'M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z'}]],

  gear:[['path',{d:'M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z'}],['circle',{cx:'12',cy:'12',r:'3'}]],
  home:[['path',{d:'M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8'}],['path',{d:'M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'}]],
  library:[['path',{d:'m16 6 4 14'}],['path',{d:'M12 6v14'}],['path',{d:'M8 8v12'}],['path',{d:'M4 4v16'}]],
  'git-branch':[['line',{x1:'6',x2:'6',y1:'3',y2:'15'}],['circle',{cx:'18',cy:'6',r:'3'}],['circle',{cx:'6',cy:'18',r:'3'}],['path',{d:'M18 9a9 9 0 0 1-9 9'}]],
  activity:[['path',{d:'M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2'}]],
  x:[['path',{d:'M18 6 6 18'}],['path',{d:'m6 6 12 12'}]],
};
function icon(name,size=14,sw=2){
  const n = ICONS[name]||ICONS.check;
  const inner = n.map(([t,a]) => '<'+t+' '+Object.entries(a).map(([k,v]) => k+'="'+v+'"').join(' ')+'/>').join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="flex-shrink:0">'+inner+'</svg>';
}
function mark(size=30){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 32 32" role="img" aria-label="SaveLocker">'
    +'<rect x="12" y="3" width="8" height="4" fill="var(--accent)"/><rect x="8" y="7" width="4" height="5" fill="var(--accent)"/>'
    +'<rect x="20" y="7" width="4" height="5" fill="var(--accent)"/><rect x="5" y="12" width="22" height="16" fill="var(--accent)"/>'
    +'<rect x="14" y="16" width="4" height="4" fill="var(--on-accent)"/><rect x="15" y="20" width="2" height="5" fill="var(--on-accent)"/></svg>';
}
function deckBadge(){return '<span class="osbadge" style="color:var(--info)">'+icon('gamepad-2',14,2)+'</span>'}
function winBadge(){return '<span class="osbadge" style="color:var(--info)"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="4" width="9" height="7"/><rect x="13" y="4" width="9" height="7"/><rect x="2" y="13" width="9" height="7"/><rect x="13" y="13" width="9" height="7"/></svg></span>'}
function fmtCode(sec){const s=Math.max(0,sec);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

const stage = document.getElementById('stage');
const narr = document.getElementById('narr');

function renderNarr(){
  const items = STEPS.map((d,i) => {
    const done = i < S.step;
    return '<li class="'+(done?'done':'')+'"><button data-act="go:'+i+'" aria-current="'+(i===S.step)+'">'
      +'<span class="n">'+(done?icon('check',12,2.6):d.id)+'</span>'
      +'<span><span class="t">'+d.title+'</span><span class="s">'+d.sub+'</span></span></button></li>';
  }).join('');
  narr.innerHTML =
    '<div class="head"><b>Walkthrough</b><span class="chip crit">Option C</span></div>'
    +'<ol class="steplist">'+items+'</ol>'
    +'<div class="narrnav">'
    +'<button class="btn sm" data-act="back" '+(S.step===0?'disabled':'')+'>'+icon('chevron-left',12,2.4)+'Back</button>'
    +'<button class="btn sm primary" data-act="next" '+(S.step===STEPS.length-1?'disabled':'')+'>Next'+icon('chevron-right',12,2.4)+'</button>'
    +'</div>'
    +'<div class="card-note"><div class="ttl">What happens here</div><ul>'+STEPS[S.step].notes.map(n=>'<li>'+n+'</li>').join('')+'</ul></div>'
    +'<div class="card-note"><div class="ttl">Building it</div><ul>'+BUILD_NOTES.map(n=>'<li>'+n+'</li>').join('')+'</ul></div>';
}

/* --- agent UI ------------------------------------------------------------------ */
function connectPanel(){
  if(S.approved){
    return '<div class="banner safe">'+icon('shield',16,2.2)
      +'<div style="flex:1;min-width:220px"><div class="ttl">Approved \u2014 registered as gameroom-pc</div>'
      +'<div class="txt">The machine key arrived over the agent\u2019s own poll and is stored in its config file. This device never had a code typed on it.</div></div>'
      +'<span class="chip ok">Pinned on first connect</span></div>'
      +'<div class="minigames">'
      +['Hades \u00b7 save folder found','Cyberpunk 2077 \u00b7 save folder found','Stardew Valley \u00b7 save folder found','Balatro \u00b7 save folder found'].map(g=>'<div class="row">'+icon('folder',13,2)+'<span>'+g+'</span></div>').join('')
      +'</div>'
      +'<div class="controw"><span class="muted">That is the whole enrollment \u2014 nothing was copied, and no code was typed on this device.</span></div>';
  }
  if(S.asked){
    return '<div class="waitpanel"><div class="sl-inline" style="justify-content:center"><span class="spinner"></span><b style="font-size:13.5px">Waiting for approval\u2026</b></div>'
      +'<p class="sl-note">Show this code on the console \u2014 the request is listed with it:</p>'
      +'<div class="codebig sm">'+S.code+'</div>'
      +'<p class="sl-note">Expires in <span data-wait>'+fmtCode(S.waitLeft)+'</span> \u00b7 checked every 2 seconds \u00b7 <button class="btn quiet sm" data-act="cancel">Cancel request</button></p></div>';
  }
  const manual = S.picked==='manual' ? '<div class="sl-field"><label>Server address</label><input class="sl-input sl-input--mono" value="http://192.168.0.124:5080" style="max-width:320px"></div>' : '';
  return '<div class="sl-card"><header><h3>Choose your server</h3><span class="chip warn">Not registered</span></header><div class="body sl-stack">'
    +'<div class="pick '+(S.picked==='disc'?'cur':'')+'" data-act="pick:disc" role="radio" aria-checked="'+(S.picked==='disc')+'" tabindex="0">'
    +'<span class="radio"></span><span class="pickicon">'+icon('wifi',17,2)+'</span>'
    +'<span class="pickmain"><b>LivingRoom</b><span class="sl-note">Found on this network \u00b7 192.168.0.124:5080</span></span>'
    +'<span class="chip ok">Found</span></div>'
    +'<div class="pick '+(S.picked==='manual'?'cur':'')+'" data-act="pick:manual" role="radio" aria-checked="'+(S.picked==='manual')+'" tabindex="0">'
    +'<span class="radio"></span><span class="pickicon">'+icon('monitor',17,2)+'</span>'
    +'<span class="pickmain"><b>Enter the address myself</b><span class="sl-note">For a server that is not on this network \u2014 a VPN, or a hostname you know.</span></span></div>'
    + manual
    +'<div class="sl-inline"><button class="btn quiet sm" data-act="toast:Rescanning the network is not part of this mockup.">'+icon('refresh-cw',12,2.2)+'Rescan</button><span class="fine">Discovery uses mDNS (<span class="mono">_savelocker._tcp</span>).</span></div>'
    +'<div class="sl-field"><label>Machine name</label><input class="sl-input" value="gameroom-pc" style="max-width:280px"></div>'
    +'<div class="sl-inline"><button class="btn primary" data-act="ask">Ask to join</button><span class="sl-note">No password or code to type \u2014 approval happens on the console.</span></div>'
    +'</div></div>';
}
function agentPage(){
  const reg = S.approved;
  const navItems = [['home','Overview'],['library','Games'],['git-branch','Conflicts'],['plus','Add games'],['activity','Activity'],['gear','Settings']];
  const nav = navItems.map(([ic,label]) => '<div class="anav '+(reg?'dim':'')+'">'+icon(ic,15,2)+'<span>'+label+'</span></div>').join('');
  return '<div class="frame frame--win"><div class="framebar"><span class="dots"><i></i><i></i><i></i></span>'
    +'<span class="title">SaveLocker \u2014 agent UI on this device (WebView2, 900\u00d7600)</span><span class="spacer"></span>'
    +'<span class="chip '+(reg?'ok':'warn')+'" style="padding:2px 8px">'+(reg?'Registered':'Not registered')+'</span></div>'
    +'<div class="agent"><div class="agentbar">'+mark(20)+'<span class="abrand">Save<span class="accent">Locker</span></span><span class="sub">'+(reg?'Settings':'First run')+'</span><span class="spacer"></span>'
    +(reg?'<span class="chip ok">'+icon('check',10,2.4)+'Enrolled</span>':'<span class="chip warn">No server key</span>')
    +'</div><div class="agentbody"><nav class="aside">'+nav+'</nav>'
    +'<div class="acontent"><div class="pagehead sl"><div><h2>Connect to SaveLocker</h2><p class="sl">This device does not have a machine key yet.</p></div></div>'
    +'<div style="margin-top:14px;max-width:640px">'+connectPanel()+'</div>'
    +'</div></div></div></div>';
}

/* --- console ------------------------------------------------------------------- */
function bellMenu(){
  if(!S.bellOpen) return '';
  const item = S.approved
    ? '<div class="bellitem"><span style="color:var(--safe);display:grid;place-items:center">'+icon('check',15,2.4)+'</span>'
      +'<div><span class="ttl">gameroom-pc approved</span><span class="sub">It can now sync. This notice clears itself.</span></div>'
      +'<div class="bellacts"><button class="btn quiet sm" data-act="bell-close">Dismiss</button></div></div>'
    : S.denied
    ? '<div class="bellitem"><span style="color:var(--accent);display:grid;place-items:center">'+icon('x',15,2.4)+'</span>'
      +'<div><span class="ttl">gameroom-pc denied</span><span class="sub">The request is gone \u2014 recorded in the audit log.</span></div>'
      +'<div class="bellacts"><button class="btn quiet sm" data-act="bell-close">Dismiss</button></div></div>'
    : '<div class="bellitem"><span class="dotbase warn live" style="margin-top:5px"></span>'
      +'<div><span class="ttl">gameroom-pc wants to join</span><span class="sub">SteamOS \u00b7 192.168.0.103 \u00b7 code <span class="mono">'+S.code+'</span></span></div>'
      +'<div class="bellacts"><button class="btn primary sm" data-act="approve">Approve</button><button class="btn quiet sm" data-act="deny">Deny</button></div></div>';
  return '<div class="bellmenu"><div class="bh"><span>Notifications</span><button class="btn quiet sm" data-act="bell-close" aria-label="Close notifications">'+icon('x',13,2.2)+'</button></div>'+item+'</div>';
}
function requestsCard(){
  let row;
  if(S.approved){
    row = '<div class="reqrow"><span class="reqicon">'+icon('gamepad-2',18,2)+'</span>'
      +'<div class="reqmain"><div class="rt">gameroom-pc <span class="chip ok">'+icon('check',10,2.4)+'Approved \u00b7 just now</span></div>'
      +'<div class="rs">SteamOS 3.7 \u00b7 Steam Deck \u00b7 192.168.0.103 \u00b7 it is syncing now.</div></div></div>';
  } else if(S.denied){
    row = '<div class="reqrow"><span class="reqicon" style="color:var(--dim)">'+icon('gamepad-2',18,2)+'</span>'
      +'<div class="reqmain"><div class="rt">gameroom-pc <span class="chip">Denied</span></div>'
      +'<div class="rs">The device was told, and the request is recorded in the audit log.</div></div></div>';
  } else if(S.asked){
    row = '<div class="reqrow"><span class="reqicon">'+icon('gamepad-2',18,2)+'</span>'
      +'<div class="reqmain"><div class="rt">gameroom-pc</div>'
      +'<div class="rs">SteamOS 3.7 \u00b7 Steam Deck \u00b7 from 192.168.0.103 \u00b7 asked to join \u00b7 code <span class="rcode">'+S.code+'</span></div></div>'
      +'<div class="reqactions"><button class="btn primary sm" data-act="approve">Approve</button><button class="btn quiet sm" data-act="deny">Deny</button></div></div>';
  } else {
    row = '<div class="empty" style="padding:18px">No devices are asking to join right now.</div>';
  }
  const note = S.asked && !S.approved && !S.denied
    ? '<div class="notebox">Approving gives this device a key that can read and write every game. Approve only if the code matches what its screen shows. Requests expire after 5 minutes.</div>'
    : '';
  return '<div class="card '+(S.step===1&&S.asked&&!S.approved&&!S.denied?'hl':'')+'"><header><h3>Join requests</h3><span class="muted">a device waiting for your approval</span></header>'
    +'<div class="pad">'+row+note+'</div></div>';
}
function machinesCard(flash){
  const body = S.approved
    ? '<div class="winwrap"><table class="dt"><thead><tr><th>Machine</th><th>Platform</th><th>Agent</th><th>Last seen</th><th>Games</th></tr></thead><tbody>'
      +'<tr><td class="k">'+deckBadge()+'gameroom-pc <span class="chip ok" style="margin-left:6px">'+icon('check',10,2.4)+'Online</span></td>'
      +'<td>SteamOS 3.7 \u00b7 Steam Deck</td><td class="m">v0.7.1</td><td><span class="chip ok">Online</span></td><td>4</td></tr>'
      +'</tbody></table></div>'
    : '<div class="empty"><b>No machines yet</b>Approve a join request above \u2014 or create a code under Enroll a machine.</div>';
  return '<div class="card '+(flash?'hl':'')+'"><header><h3>Machines</h3><span class="muted">agent health, versions and keys</span></header>'+body+'</div>';
}
function consolePage(){
  const pending = S.asked && !S.approved && !S.denied;
  return '<div class="frame"><div class="topbar">'
    +'<span class="brand">'+mark(26)+'<span>Save<span class="accent">Locker</span></span></span>'
    +'<span class="verpill">v0.7.1 <span class="dot"></span></span>'
    +'<nav class="tabs"><button class="tab">Games</button><button class="tab is-current">Configuration</button><button class="tab">Audit log</button><button class="tab">Backups</button><button class="tab">Help</button><button class="tab">What\u2019s new</button></nav>'
    +'<div class="topright"><button class="btn primary sm">'+icon('refresh-cw',13,2.3)+'Sync all</button>'
    +'<button class="iconbtn" data-act="bell-toggle" aria-label="Notifications">'+icon('bell',15,2)+(pending?'<span class="nbadge"></span>':'')+'</button>'
    + bellMenu()
    +'</div></div>'
    +'<div class="page-canvas">'
    +'<div class="pagehead"><div><h1>Configuration</h1><div class="sub">server settings \u00b7 appearance \u00b7 enrollment \u00b7 storage</div></div><span class="chip ok">Connected as admin</span></div>'
    +'<div class="strip">Server \u00b7 Appearance \u00b7 Enroll a machine (codes / links) \u00b7 \u2026 other cards unchanged</div>'
    + requestsCard()
    + machinesCard(S.step===1&&S.approved)
    +'</div></div>';
}

function render(){
  renderNarr();
  const step = STEPS[S.step];
  stage.innerHTML = step.device==='console' ? consolePage() : agentPage();
}

/* --- actions ------------------------------------------------------------------ */
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  const box=document.getElementById('toaster');box.appendChild(t);
  while(box.children.length>3)box.removeChild(box.firstChild);
  setTimeout(()=>{t.style.transition='opacity .25s';t.style.opacity='0';setTimeout(()=>t.remove(),260)},2600);
}
function setTheme(t){
  S.theme=t;
  if(t==='system')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.mockbar [data-act^="theme:"]').forEach(b=>b.classList.toggle('is-on',b.dataset.act==='theme:'+t));
}
function reset(){
  S.step=0;S.picked='disc';S.asked=false;S.approved=false;S.denied=false;S.waitLeft=272;S.bellOpen=true;
  render();toast('Mockup reset.');
}
function act(a){
  if(a==='pick:disc'||a==='pick:manual'){S.picked=a.split(':')[1];render();return}
  if(a==='ask'){S.asked=true;S.bellOpen=true;render();toast('Request sent \u2014 approve it on the console.');return}
  if(a==='cancel'){S.asked=false;render();return}
  if(a==='approve'){S.approved=true;S.denied=false;render();toast('Approved \u2014 gameroom-pc can now sync.');return}
  if(a==='deny'){S.denied=true;render();toast('Denied. The request is recorded in the audit log.');return}
  if(a==='bell-toggle'){S.bellOpen=!S.bellOpen;render();return}
  if(a==='bell-close'){S.bellOpen=false;render();return}
  if(a==='next'){if(S.step<STEPS.length-1){S.step++;render()}return}
  if(a==='back'){if(S.step>0){S.step--;render()}return}
  if(a.startsWith('go:')){S.step=+a.split(':')[1];render();return}
  if(a.startsWith('theme:'))return setTheme(a.split(':')[1]);
  if(a==='reset')return reset();
  if(a.startsWith('toast:'))return toast(a.slice(6));
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  e.preventDefault();act(el.dataset.act);
});
setInterval(()=>{
  if(S.asked&&!S.approved&&!S.denied&&S.waitLeft>0){
    S.waitLeft--;
    document.querySelectorAll('[data-wait]').forEach(el=>el.textContent=fmtCode(S.waitLeft));
  }
},1000);
setTheme('system');render();
</script>
</body>
