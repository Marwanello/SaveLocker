<style>
/* ============================================================================
   Clickable mockup — "Enrollment by join link".
   Not shipped code. Re-creates the real UI elements: console Checkpoint design
   system (web/src/index.css, web/src/components/ui/*), agent UI
   (agent-ui/src/ui.css), the Inno Setup wizard and a terminal.
   ========================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0f10;--panel:#141416;--raise:#191a1c;--tile:#1b1c1f;--hover:#202124;
  --fg:#f0eee9;--dim:#a09d97;--faint:#817e78;--line:#242427;--row:#1d1d20;
  --safe:#7fa96a;--watch:#d9a63f;--info:#7b9fd0;--accent:#e0533c;--on-accent:#160f0e;
  --accent-soft:color-mix(in oklab,var(--accent) 14%,var(--panel));
  --accent-line:color-mix(in oklab,var(--accent) 42%,var(--panel));
  --accent-ink:color-mix(in oklab,var(--accent) 80%,var(--fg));
  --safe-soft:color-mix(in oklab,var(--safe) 14%,var(--panel));
  --safe-line:color-mix(in oklab,var(--safe) 40%,var(--panel));
  --safe-ink:color-mix(in oklab,var(--safe) 82%,var(--fg));
  --watch-soft:color-mix(in oklab,var(--watch) 14%,var(--panel));
  --watch-line:color-mix(in oklab,var(--watch) 40%,var(--panel));
  --watch-ink:color-mix(in oklab,var(--watch) 82%,var(--fg));
  --font-sans:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.2,.8,.25,1);color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#f5f3ef;--panel:#fffefc;--raise:#f0ede8;--tile:#ebe7e0;--hover:#e8e3dc;
  --fg:#191719;--dim:#57534d;--faint:#79756f;--line:#e2ddd5;--row:#eeeae3;
  --safe:#4c7b3e;--watch:#8a6212;--info:#3d6aa8;--accent:#c0432c;--on-accent:#fff8f6;color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --ink:#f5f3ef;--panel:#fffefc;--raise:#f0ede8;--tile:#ebe7e0;--hover:#e8e3dc;
    --fg:#191719;--dim:#57534d;--faint:#79756f;--line:#e2ddd5;--row:#eeeae3;
    --safe:#4c7b3e;--watch:#8a6212;--info:#3d6aa8;--accent:#c0432c;--on-accent:#fff8f6;color-scheme:light;
  }
}
body{background:var(--ink);color:var(--fg);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

b{font-weight:600}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:16px 18px 44px;max-width:1440px;margin:0 auto;align-items:start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--fg);transition:background-color .15s var(--ease),transform .15s var(--ease),filter .15s var(--ease);white-space:nowrap}

.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:13px;padding:9px 18px;min-height:62px;background:var(--panel);border-bottom:1px solid var(--line)}

.verpill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:10.5px;font-family:var(--mono);color:var(--dim)}

.tabs{display:flex;flex-wrap:wrap;gap:3px}
.tab{font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid transparent;color:var(--dim);font-weight:500}
.tab:hover{background:var(--raise);color:var(--fg)}

.pagehead h2{font-size:21px;font-weight:700;letter-spacing:-.03em}
.pagehead p.sl{margin-top:5px;font-size:12px;color:var(--dim)}
.strip{border:1px dashed var(--line);border-radius:12px;padding:9px 14px;font-size:11.5px;color:var(--faint);text-align:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>header h3{font-size:14px;font-weight:600;letter-spacing:-.02em}
.card .pad{padding:15px 16px}
.dt{width:100%;border-collapse:collapse}
.dt th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
.dt td{padding:10px 16px;font-size:12.5px;color:var(--dim);border-bottom:1px solid var(--row)}
.dt tr:last-child td{border-bottom:none}
.dt td.k{color:var(--fg);font-weight:600}
.dt .m{font-family:var(--mono);font-size:11.5px}
.dt .end{text-align:right}
.winwrap{overflow-x:auto}
.empty{padding:26px 18px;text-align:center;color:var(--dim);font-size:12.5px}
.empty b{display:block;color:var(--fg);font-size:14px;font-weight:600;margin-bottom:5px}
.osbadge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;vertical-align:-3px;margin-right:7px}

.fl{display:flex;flex-direction:column;gap:4px}
.fl>span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.inp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:12.5px;padding:8px 12px}
.inp.mono{font-family:var(--mono)}
.inp::placeholder{color:var(--faint)}
.rowfields{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 110px;margin-top:12px}
.coderow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.codebox{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:100%}
.codebox code{font-family:var(--mono);font-size:11.5px;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--fg);overflow-wrap:anywhere}
.linkpanel{margin-top:14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:14px;border:1px solid var(--accent-line);border-radius:12px;background:var(--accent-soft);align-items:start;animation:rise .25s var(--ease)}
@media (max-width:640px){.linkpanel{grid-template-columns:1fr}}
.qrbox{background:#fff;border-radius:10px;padding:8px;display:grid;place-items:center;width:150px;height:150px}
.qrcap{font-size:10.5px;color:var(--dim);text-align:center;margin-top:6px}

/* --- pairing page ---------------------------------------------------------- */
.pairpage{display:grid;place-items:center;padding:30px 18px;min-height:560px;background:radial-gradient(640px 280px at 50% -80px,var(--accent-soft),transparent 70%),var(--ink)}
.paircard{width:100%;max-width:580px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:13px;animation:rise .3s var(--ease)}
.pairbrand{display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:-.03em}
.paircard h1{font-size:23px;font-weight:700;letter-spacing:-.03em}
.paircard .lead{color:var(--dim);font-size:13px}
.ospanel{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:11px;background:var(--raise)}
.ospanel .ot{font-size:13px;font-weight:600}
.pairdivider{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.pairdivider:before,.pairdivider:after{content:"";height:1px;background:var(--line);flex:1}
.term{background:#0b0b0c;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--dim);overflow-x:auto}
.term .cmd{color:var(--fg)}
.term .ok{color:var(--safe-ink)}
.banner{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);flex-wrap:wrap;animation:rise .25s var(--ease)}
.banner.safe{border-color:var(--safe-line);background:var(--safe-soft)}
.banner .txt{font-size:12px;color:var(--dim);margin-top:3px}
.banner .ttl{font-size:13.5px;font-weight:600;color:var(--safe-ink)}

/* --- installer (Inno Setup) -------------------------------------------------- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:20px}
.inno{width:100%;max-width:520px;background:#f0f0f0;color:#1a1a1a;border-radius:8px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px;animation:rise .25s var(--ease)}
.inno .title{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(#fdfdfd,#e9e9e9);border-bottom:1px solid #b7b7b7;padding:7px 10px;font-size:12px;color:#333}
.inno .winbtns{display:flex;gap:12px;color:#666;font-size:12px}

.innobtn:hover:not(:disabled){border-color:#7a7a7a}
.innobtn:disabled{opacity:.55}
.innocap{color:var(--faint);font-size:11px;text-align:center;margin-top:12px;max-width:520px}

/* --- agent UI chrome ---------------------------------------------------------- */
.agent{display:flex;flex-direction:column;height:560px;background:var(--ink)}
.agentbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}

.anav.cur{background:var(--tile);border-color:var(--line);color:var(--fg);font-weight:600}

.sl-input--mono{font-family:var(--mono);font-size:12px}
.sl-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sl-note{font-size:11.5px;color:var(--dim);line-height:1.5}
.joinbox{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

.controw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;animation:rise .25s var(--ease)}

#toaster{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:92vw}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--fg);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:toastin .25s var(--ease)}

@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent-line)}40%{box-shadow:0 0 0 3px var(--accent-line)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

/* Deterministic decorative QR (not a real code — the mockup never scans it). */
function qrSvg(text,size){
  let h=2166136261>>>0;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  let s=h>>>0||123456789;
  const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};
  const N=21,cells=[];
  const finder=(x,y)=>{for(let j=0;j<7;j++)for(let i=0;i<7;i++){
    const on=(i===0||i===6||j===0||j===6)||(i>=2&&i<=4&&j>=2&&j<=4);
    if(on)cells.push([x+i,y+j]);}};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const inFinder=(x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
    const nearFinder=(x===7&&y<8)||(y===7&&x<8)||(x===N-8&&y<8)||(y===7&&x>=N-8)||(x===7&&y>=N-8)||(y===N-8&&x<8);
    if(inFinder||nearFinder)continue;
    if(rnd()<0.47)cells.push([x,y]);
  }
  finder(0,0);finder(N-7,0);finder(0,N-7);
  const q=2,total=N+q*2;
  const rects=cells.map(([x,y])=>'<rect x="'+(x+q)+'" y="'+(y+q)+'" width="1" height="1"/>').join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+total+' '+total+'" role="img" aria-label="QR code for the join link" shape-rendering="crispEdges"><g fill="#141416">'+rects+'</g></svg>';
}
function fmtCode(sec){const s=Math.max(0,sec);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

      +'<div class="txt">The key is stored in the agent\u2019s config file. 4 games matched this machine and will start syncing.</div></div>'
      +'<span class="chip ok">Pinned on first connect</span></div>'
    : '<div class="banner" style="border-color:var(--accent-line);background:var(--accent-soft)">'+icon('key',16,2.2)+'<div style="flex:1;min-width:200px"><div class="ttl" style="color:var(--accent-ink)">Joining LivingRoom</div>'
      +'<div class="txt">The link you opened filled in the code \u2014 one click to finish.</div></div>'
      +'<button class="btn primary sm" data-act="finish-link">Finish enrollment</button></div>';
  return '<div class="frame frame--win"><div class="framebar"><span class="dots"><i></i><i></i><i></i></span>'
    +'<span class="title">SaveLocker \u2014 agent UI on this device (WebView2)</span><span class="spacer"></span>'
    +'<button class="btn quiet sm" data-act="view:pair">'+icon('chevron-left',12,2.4)+'Back to the pairing page</button></div>'
    +'<div class="agent"><div class="agentbar">'+mark(20)+'<span class="abrand">Save<span class="accent">Locker</span></span><span class="sub">Settings</span><span class="spacer"></span>'
    +(reg?'<span class="chip ok">'+icon('check',10,2.4)+'Enrolled</span>':'<span class="chip warn">No server key</span>')
    +'</div><div class="agentbody"><nav class="aside">'+nav+'</nav>'
    +'<div class="acontent">'+banner
    +'<div class="sl-card" style="margin-top:14px"><header><h3>Connection</h3>'
    +(reg?'<span class="chip ok">'+icon('check',10,2.4)+'Registered</span>':'<span class="chip warn">Not pinned yet</span>')
    +'</header><div class="body sl-stack">'
    +'<div class="sl-field"><label>Server URL</label><input class="sl-input sl-input--mono" value="http://livingroom:5080"></div>'
    +'<div class="sl-field"><label>Machine name</label><input class="sl-input" value="gameroom-pc" style="max-width:280px"></div>'
    +'<div class="joinbox"><div class="joinbox__head">'+icon('key',15,2.2)+'Join with a code</div>'
    +'<p class="sl-note">Filled in from the join link you opened in the browser.</p>'
    +'<div class="sl-inline"><input class="sl-input sl-input--mono codeinput" value="'+S.code+'" aria-label="Enrollment code" disabled>'
    +(reg?'':'<button class="btn primary" data-act="finish-link">Finish enrollment</button>')+'</div></div>'
    +'<div class="sl-note">'+(reg?'Registered \u2014 this machine holds a key for the server. ':'Not registered yet. ')+'The key is kept in the agent\u2019s config file and never shown here.</div>'
    +(reg?'<div class="controw"><button class="btn sm primary" data-act="next">Continue \u2014 check the console'+icon('chevron-right',12,2.4)+'</button></div>':'')
    +'</div></div></div></div></div></div>';
}

function render(){
  renderNarr();
  const step = STEPS[S.step];
  if(step.device==='console') stage.innerHTML = consolePage();
  else if(S.view==='pair') stage.innerHTML = pairPage();
  else stage.innerHTML = agentPage();
}

/* --- actions ------------------------------------------------------------------ */
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  const box=document.getElementById('toaster');box.appendChild(t);
  while(box.children.length>3)box.removeChild(box.firstChild);
  setTimeout(()=>{t.style.transition='opacity .25s';t.style.opacity='0';setTimeout(()=>t.remove(),260)},2600);
}
function copy(text,msg){try{navigator.clipboard.writeText(text)}catch(e){}toast(msg)}

function runInstaller(){
  S.dl='running';S.prog=6;S.wizHead='Enrolling this machine';S.wizMeta='Downloading SaveLocker Agent\u2026';S.wizDone=false;render();
  const steps=[
    [1400,42,'Downloading SaveLocker Agent\u2026 (29 of 68 MB)'],
    [1200,68,'Installing\u2026'],
    [1200,86,'Registering this PC with LivingRoom\u2026'],
    [1200,100,'Enrolled as gameroom-pc \u00b7 4 games matched.'],
  ];
  let i=0;
  const next=()=>{
    if(i>=steps.length){S.wizHead='Completing SaveLocker Agent Setup';S.wizDone=true;render();return}
    const [delay,prog,meta]=steps[i++];
    S.prog=prog;S.wizMeta=meta;render();
    setTimeout(next,delay);
  };
  setTimeout(next,700);
}
function finishLink(){
  S.finishBusy=true;render();
  setTimeout(()=>{S.enrolled=true;S.finishBusy=false;render();toast('Enrolled \u2014 the link is used up and the machine key is stored.')},1100);
}
function setTheme(t){
  S.theme=t;
  if(t==='system')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.mockbar [data-act^="theme:"]').forEach(b=>b.classList.toggle('is-on',b.dataset.act==='theme:'+t));
}
function reset(){
  S.step=0;S.created=false;S.enrolled=false;S.codeLeft=899;S.os='windows';S.view='pair';S.dl='idle';S.prog=0;S.wizDone=false;
  render();toast('Mockup reset.');
}
function act(a){
  if(a==='create'){S.created=true;render();toast('Join link created \u2014 open it on the new machine.');return}
  if(a==='hide-link'){S.created=false;render();return}
  if(a==='copy-link')return copy(JOIN_URL,'Copied the join link.');
  if(a==='copy-curl')return copy('curl -fsSL '+JOIN_URL+'/install.sh | sh','Copied the one-liner.');
  if(a==='download')return runInstaller();
  if(a==='wiz-finish'){S.dl='done';S.enrolled=true;render();toast('Installer finished \u2014 gameroom-pc is enrolled.');return}
  if(a.startsWith('os:')){S.os=a.split(':')[1];render();return}
  if(a.startsWith('view:')){S.view=a.split(':')[1];render();return}
  if(a==='finish-link')return finishLink();
  if(a==='next'){if(S.step<STEPS.length-1){S.step++;S.view='pair';render()}return}
  if(a==='back'){if(S.step>0){S.step--;render()}return}
  if(a.startsWith('go:')){S.step=+a.split(':')[1];if(STEPS[S.step].device==='browser')S.view='pair';render();return}
  if(a.startsWith('theme:'))return setTheme(a.split(':')[1]);
  if(a==='reset')return reset();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  e.preventDefault();act(el.dataset.act);
});
setInterval(()=>{
  if(S.created&&!S.enrolled&&S.codeLeft>0){
    S.codeLeft--;
    document.querySelectorAll('[data-cd]').forEach(el=>el.textContent=fmtCode(S.codeLeft));
  }
},1000);
setTheme('system');render();
</script>
</body>
</html>
